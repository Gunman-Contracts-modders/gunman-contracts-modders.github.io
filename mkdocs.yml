site_name: Gunman Contracts Modding Notes
site_description: Community notes on the functions found in Gunman Contracts Standalone and when they are triggered.
# The repo must be named "gunman-contract-modders.github.io" so the site lands on the
# organisation's root address, without a repo name at the end.
site_url: https://gunman-contracts-modders.github.io/gunman-contracts-modding-docs/
repo_url: https://github.com/Gunman-Contracts-modders/gunman-contracts-modding-docs
edit_uri: edit/main/docs/

# No nav here: pages are picked up from the folder structure automatically.
# A new folder in docs/ becomes a new section; nobody has to edit this file.
# The order of the top-level pages is set in docs/.nav.yml.

theme:
  name: material
  font: false  # fonts are self-hosted, see docs/stylesheets/extra.css
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - macros
  - awesome-nav

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - stylesheets/extra.css
